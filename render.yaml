# Render Blueprint: Meeting Room Booking
# Deploy from repo root: New > Blueprint > connect repo > Deploy
# After first deploy: set Static Site env VITE_API_URL = your Backend URL (e.g. https://meeting-room-booking-api.onrender.com)

databases:
  - name: meeting-room-booking-db
    plan: free

services:
  # Backend API (Node.js + Express + TypeORM)
  - type: web
    name: meeting-room-booking-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-room-booking-db
          property: connectionString
      - key: NODE_ENV
        value: production

  # Frontend (React + Vite static site)
  - type: web
    name: meeting-room-booking-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
        # After first deploy: set this in Dashboard to your Backend URL, e.g. https://meeting-room-booking-api.onrender.com
